<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220">

  <!-- Steam -->
  <g opacity="0.65" stroke="#cccccc" stroke-width="5" fill="none" stroke-linecap="round">

    <path d="M75 105 C65 85 85 65 75 45">
      <animateTransform attributeName="transform" type="translate" values="0 0;4 0;-4 0;0 0" dur="2.4s" repeatCount="indefinite"></animateTransform>
    </path>

    <path d="M110 95 C100 70 120 45 110 20">
      <animateTransform attributeName="transform" type="translate" values="0 0;-4 0;4 0;0 0" dur="2.8s" repeatCount="indefinite"></animateTransform>
    </path>

    <path d="M145 105 C135 80 155 60 145 35">
      <animateTransform attributeName="transform" type="translate" values="0 0;3 0;-3 0;0 0" dur="2.2s" repeatCount="indefinite"></animateTransform>
    </path>

  </g>

  <!-- Shadow -->
  <ellipse cx="110" cy="183" rx="70" ry="12" fill="#00000022"></ellipse>

  <!-- Cow Pat -->
  <g>

    <ellipse cx="110" cy="150" rx="72" ry="34" fill="#8b5a2b"></ellipse>

    <ellipse cx="110" cy="126" rx="56" ry="26" fill="#966331"></ellipse>

    <ellipse cx="110" cy="105" rx="38" ry="18" fill="#a26d36"></ellipse>

    <ellipse cx="110" cy="91" rx="18" ry="10" fill="#ad7740"></ellipse>

    <!-- Little bump -->
    <path d="M108 81
             C118 70 128 78 122 88
             C117 95 104 92 108 81" fill="#ad7740"></path>

  </g>

  <!-- Grass bits -->
  <g stroke="#3c9c34" stroke-width="3" stroke-linecap="round">
    <line x1="73" y1="147" x2="68" y2="139"></line>
    <line x1="95" y1="134" x2="91" y2="126"></line>
    <line x1="138" y1="132" x2="143" y2="124"></line>
    <line x1="156" y1="154" x2="162" y2="145"></line>
    <line x1="118" y1="163" x2="122" y2="155"></line>
    <line x1="88" y1="165" x2="82" y2="157"></line>
  </g>

  <!-- Eyes -->
  <g>

    <!-- whites -->
    <ellipse cx="96" cy="120" rx="8" ry="9" fill="white"></ellipse>
    <ellipse cx="124" cy="120" rx="8" ry="9" fill="white"></ellipse>

    <!-- pupils -->
    <circle cx="98" cy="122" r="3" fill="#222">
      <animate attributeName="cx" values="98;96;100;98" dur="5s" repeatCount="indefinite"></animate>
    </circle>

    <circle cx="126" cy="122" r="3" fill="#222">
      <animate attributeName="cx" values="126;124;128;126" dur="5s" repeatCount="indefinite"></animate>
    </circle>

    <!-- Blink -->
    <rect x="88" y="111" width="16" height="18" fill="#966331">
      <animate attributeName="height" values="0;0;18;0;0" keyTimes="0;0.45;0.5;0.55;1" dur="4s" repeatCount="indefinite"></animate>
    </rect>

    <rect x="116" y="111" width="16" height="18" fill="#966331">
      <animate attributeName="height" values="0;0;18;0;0" keyTimes="0;0.45;0.5;0.55;1" dur="4s" repeatCount="indefinite"></animate>
    </rect>

  </g>

  <!-- Smile -->
  <path d="M98 138 Q110 146 122 138" fill="none" stroke="#40250d" stroke-width="2.5" stroke-linecap="round"></path>

</svg>